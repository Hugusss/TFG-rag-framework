[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-framework"
version = "0.1.0"
description = "Modular Collective RAG Pipeline over the Open Web Index (OWI)"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Hugo Miranda" }]
# Runtime dependencies are added together with the component that first
# needs them, so every addition is traceable to a seam.
dependencies = [
    "pyyaml>=6,<7",    # config seam
    "pyarrow>=25,<26", # owi loader seam
]

[project.optional-dependencies]
dev = ["pytest>=9,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
