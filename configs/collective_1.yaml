# Collective retrieval over a single partition: the P = 1 point of the
# partition-scaling experiment. Same official OWI chunks and precomputed
# vectors as local_chroma.yaml, in one collection named
# <collection>-p00of01, searched through the executor and merged —
# the same code path as P = 8, so the two are comparable. A local
# simulation of collective retrieval, not a
# distributed system.
#
# Each partition count gets its own store directory so index sizes
# are measured per layout; the baseline collection lives in ./state/chroma.

dataset:
  loader: owi
  path: ./data/owi
  version: owi-v2.0.0-gpu-spa-2026-07-28

chunking:
  strategy: publisher_offsets

embedding:
  provider: precomputed
  model: jinaai/jina-embeddings-v5-text-small
  normalize: true

vector_store:
  type: chroma
  path: ./state/chroma-collective-p1
  collection: owi-spa0728-publisherchunks-jinav5small-v1

retrieval:
  mode: collective
  k: 10
  partitions: 1
  workers: 1
  executor: threads

generation:
  enabled: false
  provider: mock

metrics:
  output: ./results
